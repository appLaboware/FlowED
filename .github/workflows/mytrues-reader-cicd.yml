name: MyTrues Reader CI/CD

on:
  push:
    branches:
      - tools/ideos-lab
    paths:
      - "Tools/MyTrues/typedb-poc-bridge/reader/**"
      - ".github/workflows/mytrues-reader-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}

concurrency:
  group: mytrues-reader-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve Azure identifiers
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          extract() {
            local key="$1"
            printf '%s\n' "$AZURE_BUNDLE" |
              sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*[:=][[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\\2/p" |
              tail -n 1
          }
          CLIENT_ID="$(extract AZURE_CLIENT_ID)"
          TENANT_ID="$(extract AZURE_TENANT_ID)"
          SUBSCRIPTION_ID="$(extract AZURE_SUBSCRIPTION_ID)"
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" && test -n "$SUBSCRIPTION_ID"
          echo "::add-mask::$CLIENT_ID"; echo "::add-mask::$TENANT_ID"; echo "::add-mask::$SUBSCRIPTION_ID"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"
          TOKEN="$(jq -r '.value' <<<"$RESPONSE")"
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          {
            echo "token<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login Azure
        shell: bash
        run: |
          set -euo pipefail
          az login --service-principal             --username "${{ steps.azure.outputs.client_id }}"             --tenant "${{ steps.azure.outputs.tenant_id }}"             --federated-token "${{ steps.oidc.outputs.token }}"             --allow-no-subscriptions -o none
          az account set --subscription "${{ steps.azure.outputs.subscription_id }}"

      - name: Deploy exact Git commit to Azure Container Apps
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rg=rg-flowed-ideos-lab
          env=mytrues-memory-env
          app=mytrues-reader
          sub="$(az account show --query id -o tsv)"
          env_id="$(az containerapp env show -g "$rg" -n "$env" --query id -o tsv)"
          location="$(az containerapp env show -g "$rg" -n "$env" --query location -o tsv)"
          source="https://raw.githubusercontent.com/appLaboware/FlowED/${GITHUB_SHA}/Tools/MyTrues/typedb-poc-bridge/reader/index.html"
          suffix="git-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          url="https://management.azure.com/subscriptions/$sub/resourceGroups/$rg/providers/Microsoft.App/containerApps/$app?api-version=2025-07-01"

          jq -n             --arg location "$location"             --arg env_id "$env_id"             --arg source "$source"             --arg suffix "$suffix"             --arg sha "$GITHUB_SHA"             '{
              location:$location,
              tags:{project:"MyTrues",role:"human-reader",deployedBy:"github-actions"},
              properties:{
                managedEnvironmentId:$env_id,
                configuration:{
                  activeRevisionsMode:"Single",
                  ingress:{external:true,targetPort:80,transport:"Auto",allowInsecure:false}
                },
                template:{
                  revisionSuffix:$suffix,
                  containers:[{
                    name:"reader",
                    image:"nginx:1.27-alpine",
                    command:["/bin/sh"],
                    args:["-c",("wget -qO /usr/share/nginx/html/index.html \"" + $source + "\" && exec nginx -g \"daemon off;\"")],
                    env:[{name:"READER_GIT_SHA",value:$sha}],
                    resources:{cpu:0.25,memory:"0.5Gi"}
                  }],
                  scale:{minReplicas:1,maxReplicas:1}
                }
              }
            }' > /tmp/reader-app.json

          az rest --method put --url "$url"             --headers "Content-Type=application/json"             --body @/tmp/reader-app.json             --only-show-errors -o none

          for i in $(seq 1 60); do
            state="$(az containerapp show -g "$rg" -n "$app" --query properties.provisioningState -o tsv 2>/dev/null || true)"
            latest="$(az containerapp show -g "$rg" -n "$app" --query properties.latestRevisionName -o tsv 2>/dev/null || true)"
            if [ "$state" = "Succeeded" ] && printf '%s' "$latest" | grep -Fq "$suffix"; then
              break
            fi
            [ "$state" = "Failed" ] && exit 1
            sleep 5
          done

          fqdn="$(az containerapp show -g "$rg" -n "$app" --query properties.configuration.ingress.fqdn -o tsv)"
          revision="$(az containerapp show -g "$rg" -n "$app" --query properties.latestRevisionName -o tsv)"
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed Reader
        shell: bash
        run: |
          set -euo pipefail
          url="https://${{ steps.deploy.outputs.fqdn }}/"
          ok=false
          for i in $(seq 1 40); do
            if curl -fsS --max-time 15 "$url" -o /tmp/reader.html; then
              if grep -q '<title>MyTrues · Human Reader</title>' /tmp/reader.html; then
                ok=true
                break
              fi
            fi
            sleep 3
          done
          test "$ok" = true
          echo "READER_CICD_PASS"
          echo "commit=$GITHUB_SHA"
          echo "revision=${{ steps.deploy.outputs.revision }}"
          echo "url=$url"

      - name: Smoke custom domain when available
        shell: bash
        run: |
          set -euo pipefail
          if dig +short CNAME reader.mytrues.io | grep -q .; then
            if curl -fsS --max-time 15 https://reader.mytrues.io/ -o /tmp/custom.html; then
              grep -q '<title>MyTrues · Human Reader</title>' /tmp/custom.html
              echo "READER_CUSTOM_DOMAIN_PASS=https://reader.mytrues.io/"
            fi
          else
            echo "reader.mytrues.io not published yet; generated Azure endpoint passed."
          fi
