name: IDEOS Azure credentials probe

on:
  push:
    branches:
      - tools/ideos-lab
    paths:
      - "Tools/IDEOS/experiments/EXP-003-azure-compose/**"
      - ".github/workflows/ideos-azure-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  azure-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure using repository secret AZURE
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE }}

      - name: Verify Azure identity
        run: |
          set -euo pipefail
          az account show --output table

      - name: Verify laboratory resource group
        run: |
          set -euo pipefail
          az group show             --name rg-flowed-ideos-lab             --query "{name:name,location:location,id:id}"             --output table
