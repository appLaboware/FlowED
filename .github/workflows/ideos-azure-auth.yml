name: IDEOS Azure OIDC probe

on:
  push:
    branches:
      - tools/ideos-lab
    paths:
      - "Tools/IDEOS/experiments/EXP-003-azure-compose/**"
      - ".github/workflows/ideos-azure-auth.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  azure-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          set -euo pipefail
          az account show --output table

      - name: Verify laboratory resource group
        run: |
          set -euo pipefail
          az group show             --name rg-flowed-ideos-lab             --query "{name:name,location:location,id:id}"             --output table

      - name: Verify Contributor assignment
        run: |
          set -euo pipefail
          SCOPE="$(az group show --name rg-flowed-ideos-lab --query id -o tsv)"
          COUNT="$(az role assignment list             --assignee "${{ secrets.AZURE_CLIENT_ID }}"             --scope "$SCOPE"             --query "[?roleDefinitionName=='Contributor'] | length(@)"             -o tsv)"
          test "$COUNT" -ge 1
          echo "OIDC authentication and scoped Contributor RBAC are operational."
