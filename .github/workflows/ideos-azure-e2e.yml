name: IDEOS Azure end-to-end materialization

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-flowed-ideos-lab
  LOCATION: brazilsouth
  APP_NAME: ideos-e2e
  CONTAINER_IMAGE: mcr.microsoft.com/azuredocs/aci-helloworld:latest

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Login to Azure using repository secret AZURE
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE }}

      - name: Verify identity and scope
        run: |
          set -euo pipefail
          az account show --output table
          az group show --name "$RESOURCE_GROUP" --output table

      - name: Materialize public application
        id: deploy
        run: |
          set -euo pipefail
          DNS_LABEL="ideos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CONTAINER_NAME="${APP_NAME}-${GITHUB_RUN_ID}"
          echo "container_name=$CONTAINER_NAME" >> "$GITHUB_OUTPUT"

          az container create             --resource-group "$RESOURCE_GROUP"             --name "$CONTAINER_NAME"             --location "$LOCATION"             --image "$CONTAINER_IMAGE"             --os-type Linux             --cpu 1             --memory 1             --ports 80             --ip-address Public             --dns-name-label "$DNS_LABEL"             --restart-policy Never             --output none

          FQDN="$(az container show             --resource-group "$RESOURCE_GROUP"             --name "$CONTAINER_NAME"             --query ipAddress.fqdn             -o tsv)"

          test -n "$FQDN"
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "Materialized endpoint: http://$FQDN"

      - name: Wait for application
        run: |
          set -euo pipefail
          FQDN="${{ steps.deploy.outputs.fqdn }}"
          CONTAINER_NAME="${{ steps.deploy.outputs.container_name }}"

          for attempt in $(seq 1 30); do
            STATE="$(az container show               --resource-group "$RESOURCE_GROUP"               --name "$CONTAINER_NAME"               --query instanceView.state               -o tsv 2>/dev/null || true)"

            echo "attempt=$attempt state=$STATE endpoint=http://$FQDN"

            if curl --fail --silent --show-error --max-time 10 "http://$FQDN" >/tmp/response.html; then
              echo "HTTP endpoint is responding."
              head -c 500 /tmp/response.html
              echo
              exit 0
            fi

            sleep 10
          done

          echo "Application did not become reachable in time." >&2
          az container logs             --resource-group "$RESOURCE_GROUP"             --name "$CONTAINER_NAME" || true
          exit 1

      - name: Prove materialized resource
        run: |
          set -euo pipefail
          az container show             --resource-group "$RESOURCE_GROUP"             --name "${{ steps.deploy.outputs.container_name }}"             --query "{name:name,state:instanceView.state,fqdn:ipAddress.fqdn,ip:ipAddress.ip}"             --output table

      - name: Destroy application
        if: always() && steps.deploy.outputs.container_name != ''
        run: |
          set -euo pipefail
          az container delete             --resource-group "$RESOURCE_GROUP"             --name "${{ steps.deploy.outputs.container_name }}"             --yes

      - name: Verify destruction
        if: always() && steps.deploy.outputs.container_name != ''
        run: |
          set -euo pipefail
          NAME="${{ steps.deploy.outputs.container_name }}"
          if az container show --resource-group "$RESOURCE_GROUP" --name "$NAME" >/dev/null 2>&1; then
            echo "ERROR: container still exists after destroy." >&2
            exit 1
          fi
          echo "Destroy verified: $NAME no longer exists."
