name: MyTrues public-private site smoke

on:
  push:
    branches: [tools/ideos-lab]
    paths: ['.github/workflows/mytrues-site-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify teaser, private portal gate, interest route and OAuth start
        shell: bash
        run: |
          set -euo pipefail
          base=https://mytrues-reader.ambitioushill-c7dc3aef.brazilsouth.azurecontainerapps.io

          curl -fsS "$base/" -o /tmp/home
          grep -q '<title>MyTrues</title>' /tmp/home
          grep -q 'Estamos preparando' /tmp/home
          grep -q 'Acesso reservado' /tmp/home
          echo "PUBLIC_TEASER_PASS"

          code="$(curl -sS -D /tmp/app-h -o /dev/null -w '%{http_code}' "$base/app")"
          test "$code" = "302"
          grep -qi '^location: /login' /tmp/app-h
          echo "PRIVATE_APP_GATE_PASS"

          curl -fsS "$base/login" -o /tmp/login
          grep -q 'Continuar com Google' /tmp/login
          echo "BRANDED_LOGIN_PASS"

          # Honeypot path proves the public interest route without creating test data.
          code="$(curl -sS -o /tmp/interest -w '%{http_code}'             -H 'content-type: application/json'             --data '{"display_name":"Smoke","email":"smoke@example.invalid","website":"bot-field"}'             "$base/api/interest")"
          test "$code" = "200"
          jq -e '.ok == true' /tmp/interest >/dev/null
          echo "PUBLIC_INTEREST_ROUTE_PASS"

          curl -sS -D /tmp/auth-h -o /dev/null "$base/auth/start"
          grep -qi '^HTTP/.* 302' /tmp/auth-h
          loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' /tmp/auth-h)"

          python3 - "$loc" <<'PY'
import sys,urllib.parse as u
parsed=u.urlparse(sys.argv[1])
qs=u.parse_qs(parsed.query)
redirect=(qs.get("redirect_uri") or [""])[0]
method=(qs.get("code_challenge_method") or [""])[0]
print("OAUTH_HOST="+parsed.netloc)
print("OAUTH_PATH="+parsed.path)
print("OAUTH_REDIRECT="+redirect)
print("OAUTH_PKCE_METHOD="+method)
assert parsed.scheme=="https"
assert parsed.netloc=="mcp.mytrues.io"
assert parsed.path.rstrip("/")=="/authorize"
assert redirect in {
    "https://mytrues-reader.ambitioushill-c7dc3aef.brazilsouth.azurecontainerapps.io/auth/callback",
    "https://reader.mytrues.io/auth/callback",
}
assert method=="S256"
print("OAUTH_LOCATION_SEMANTIC_PASS")
PY

          # Independently prove the callback is accepted by DCR; no Google account is automated here.
          code="$(curl -sS -o /tmp/dcr -w '%{http_code}' -H 'content-type: application/json' \
            --data '{"client_name":"MyTrues site smoke","redirect_uris":["https://mytrues-reader.ambitioushill-c7dc3aef.brazilsouth.azurecontainerapps.io/auth/callback"],"grant_types":["authorization_code","refresh_token"],"response_types":["code"],"token_endpoint_auth_method":"none","application_type":"web"}' \
            https://mcp.mytrues.io/register)"
          test "$code" = "201" -o "$code" = "200"
          jq -e '.client_id' /tmp/dcr >/dev/null
          echo "GOOGLE_OAUTH_START_PASS"
