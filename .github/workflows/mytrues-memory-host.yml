name: MyTrues memory Azure host bootstrap
on:
  push:
    branches: [tools/ideos-lab]
    paths: ['.github/workflows/mytrues-memory-host.yml', '.github/mytrues-live-payload.json']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}
  AZURE_CLIENT_ID_SECRET: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID_SECRET: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID_SECRET: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve Azure repository credentials
        id: azure
        shell: bash
        run: |
          set -euo pipefail

          get_bundle_value() {
            local key="$1"
            printf '%s\n' "$AZURE_BUNDLE" |
              sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*=[[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\2/p" |
              tail -n 1
          }

          CLIENT_ID="$AZURE_CLIENT_ID_SECRET"
          TENANT_ID="$AZURE_TENANT_ID_SECRET"
          SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID_SECRET"
          SOURCE="separate repository secrets"

          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ] || [ -z "$SUBSCRIPTION_ID" ]; then
            SOURCE="legacy AZURE bundle secret"
            CLIENT_ID="${CLIENT_ID:-$(get_bundle_value AZURE_CLIENT_ID)}"
            TENANT_ID="${TENANT_ID:-$(get_bundle_value AZURE_TENANT_ID)}"
            SUBSCRIPTION_ID="${SUBSCRIPTION_ID:-$(get_bundle_value AZURE_SUBSCRIPTION_ID)}"
          fi

          test -n "$CLIENT_ID" || { echo "AZURE_CLIENT_ID is unavailable." >&2; exit 1; }
          test -n "$TENANT_ID" || { echo "AZURE_TENANT_ID is unavailable." >&2; exit 1; }
          test -n "$SUBSCRIPTION_ID" || { echo "AZURE_SUBSCRIPTION_ID is unavailable." >&2; exit 1; }

          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$TENANT_ID"
          echo "::add-mask::$SUBSCRIPTION_ID"

          {
            echo "client_id=$CLIENT_ID"
            echo "tenant_id=$TENANT_ID"
            echo "subscription_id=$SUBSCRIPTION_ID"
          } >> "$GITHUB_OUTPUT"

          echo "Azure credentials resolved from: $SOURCE"
          echo "Preferred format: three separate repository secrets."

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"

          TOKEN="$(jq -r '.value' <<<"$RESPONSE")"
          test -n "$TOKEN"
          test "$TOKEN" != "null"

          echo "::add-mask::$TOKEN"
          {
            echo "token<<OIDC_EOF"
            echo "$TOKEN"
            echo "OIDC_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "GitHub issued an OIDC token."

      - name: Login to Azure using federated identity
        shell: bash
        run: |
          set -euo pipefail

          az login             --service-principal             --username "${{ steps.azure.outputs.client_id }}"             --tenant "${{ steps.azure.outputs.tenant_id }}"             --federated-token "${{ steps.oidc.outputs.token }}"             --allow-no-subscriptions             --output none

          az account set --subscription "${{ steps.azure.outputs.subscription_id }}"

          az account show             --query "{subscription:id,tenant:tenantId,identity:user.name,type:user.type}"             --output table


      - name: Inspect existing persistent databases
        shell: bash
        run: |
          set -euo pipefail
          az postgres flexible-server list --query "[].{name:name,group:resourceGroup,location:location,version:version,state:state,fqdn:fullyQualifiedDomainName}" -o json
          az keyvault list --query "[].{name:name,group:resourceGroup,location:location}" -o json

      - name: Provision managed container environment
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          rg=rg-flowed-ideos-lab
          name=mytrues-memory-env
          if ! az containerapp env show -g "$rg" -n "$name" -o none 2>/dev/null; then
            az containerapp env create -g "$rg" -n "$name" --location brazilsouth --logs-destination none --only-show-errors -o none
          fi
          az containerapp env show -g "$rg" -n "$name" --query "{name:name,location:location,state:properties.provisioningState,domain:properties.defaultDomain}" -o json

      - name: Provision persistent PostgreSQL with federated authentication
        shell: bash
        run: |
          set -euo pipefail
          rg=rg-flowed-ideos-lab
          name=mytrues-canonical-pg
          if ! az postgres flexible-server show -g "$rg" -n "$name" -o none 2>/dev/null; then
            export MYTRUES_MANAGEMENT_TOKEN="$(az account get-access-token --query accessToken -o tsv)"
            oid="$(python -c 'import os,json,base64; p=os.environ["MYTRUES_MANAGEMENT_TOKEN"].split(".")[1]; print(json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4)))["oid"])')"
            echo "::add-mask::$oid"
            unset MYTRUES_MANAGEMENT_TOKEN
            help="$(az postgres flexible-server create --help)"
            auth=--microsoft-entra-auth
            if ! grep -q -- '--microsoft-entra-auth' <<<"$help"; then auth=--active-directory-auth; fi
            az postgres flexible-server create -g "$rg" -n "$name" --location brazilsouth \
              --version 18 --tier Burstable --sku-name Standard_B1ms --storage-size 32 \
              --backup-retention 7 --public-access None "$auth" Enabled --password-auth Disabled \
              --admin-object-id "$oid" --admin-display-name mytrues-workflow --admin-type ServicePrincipal \
              --yes --only-show-errors -o none
          fi
          az postgres flexible-server show -g "$rg" -n "$name" \
            --query "{name:name,state:state,version:version,host:fullyQualifiedDomainName,auth:authConfig}" -o json

      - name: Prepare private payload encryption key
        shell: bash
        run: |
          set -euo pipefail
          rg=rg-flowed-ideos-lab
          vault=mytrues-ingest-kv
          export MYTRUES_MANAGEMENT_TOKEN="$(az account get-access-token --query accessToken -o tsv)"
          oid="$(python -c 'import os,json,base64; p=os.environ["MYTRUES_MANAGEMENT_TOKEN"].split(".")[1]; print(json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4)))["oid"])')"
          echo "::add-mask::$oid"
          unset MYTRUES_MANAGEMENT_TOKEN
          if ! az keyvault show -g "$rg" -n "$vault" -o none 2>/dev/null; then
            az keyvault create -g "$rg" -n "$vault" --location brazilsouth --enable-rbac-authorization false --only-show-errors -o none
          fi
          az keyvault set-policy -g "$rg" -n "$vault" --object-id "$oid" --key-permissions get create decrypt encrypt --only-show-errors -o none
          if ! az keyvault key show --vault-name "$vault" -n chat-transfer -o none 2>/dev/null; then
            az keyvault key create --vault-name "$vault" -n chat-transfer --kty RSA --size 3072 --ops encrypt decrypt --only-show-errors -o none
          fi
          az keyvault key show --vault-name "$vault" -n chat-transfer --query key -o json

      - name: Ingest sealed private records into persistent PostgreSQL
        env:
          MYTRUES_SEALED_PAYLOAD: ''
        shell: bash
        run: |
          set -euo pipefail
          rg=rg-flowed-ideos-lab
          name=mytrues-canonical-pg
          rule=ingest-"$GITHUB_RUN_ID"
          ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          az postgres flexible-server db create -g "$rg" -s "$name" -d mytrues --only-show-errors -o none
          az postgres flexible-server firewall-rule create -g "$rg" -n "$name" --rule-name "$rule" --start-ip-address "$ip" --end-ip-address "$ip" --only-show-errors -o none
          trap 'az postgres flexible-server firewall-rule delete -g "$rg" -n "$name" --rule-name "$rule" --yes --only-show-errors -o none' EXIT
          pip install --quiet 'psycopg[binary]==3.2.3' azure-identity==1.25.0 azure-keyvault-keys==4.10.0 cryptography==46.0.0
          python - <<'PY'
          import os,json,base64,io,zipfile,tempfile,pathlib,subprocess
          from azure.identity import AzureCliCredential
          from azure.keyvault.keys.crypto import CryptographyClient,EncryptionAlgorithm
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          obj=json.loads(base64.b64decode(os.environ["MYTRUES_SEALED_PAYLOAD"]))
          assert obj["schema"]=="mytrues.private-transfer/1"
          assert obj["kid"].startswith("https://mytrues-ingest-kv.vault.azure.net/keys/chat-transfer/")
          decode=base64.b64decode
          client=CryptographyClient(obj["kid"],AzureCliCredential())
          session=client.decrypt(EncryptionAlgorithm.rsa_oaep_256,decode(obj["wrapped_key"])).plaintext
          package=AESGCM(session).decrypt(decode(obj["nonce"]),decode(obj["ciphertext"]),b"mytrues.private-transfer/1")
          with tempfile.TemporaryDirectory() as root:
              archive=zipfile.ZipFile(io.BytesIO(package))
              for name in ("separation.py","postgres_adapter.py","transfer.py","chat_record.py","bridge_ingest.py","decisions.json","capture.json"):
                  pathlib.Path(root,name).write_bytes(archive.read(name))
              subprocess.run(["python","bridge_ingest.py"],cwd=root,check=True)
          PY
