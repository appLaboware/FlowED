name: MyTrues memory Azure host bootstrap
on:
  push:
    branches: [tools/ideos-lab]
    paths: ['.github/workflows/mytrues-memory-host.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}
  AZURE_CLIENT_ID_SECRET: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID_SECRET: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID_SECRET: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve Azure repository credentials
        id: azure
        shell: bash
        run: |
          set -euo pipefail

          get_bundle_value() {
            local key="$1"
            printf '%s\n' "$AZURE_BUNDLE" |
              sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*=[[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\2/p" |
              tail -n 1
          }

          CLIENT_ID="$AZURE_CLIENT_ID_SECRET"
          TENANT_ID="$AZURE_TENANT_ID_SECRET"
          SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID_SECRET"
          SOURCE="separate repository secrets"

          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ] || [ -z "$SUBSCRIPTION_ID" ]; then
            SOURCE="legacy AZURE bundle secret"
            CLIENT_ID="${CLIENT_ID:-$(get_bundle_value AZURE_CLIENT_ID)}"
            TENANT_ID="${TENANT_ID:-$(get_bundle_value AZURE_TENANT_ID)}"
            SUBSCRIPTION_ID="${SUBSCRIPTION_ID:-$(get_bundle_value AZURE_SUBSCRIPTION_ID)}"
          fi

          test -n "$CLIENT_ID" || { echo "AZURE_CLIENT_ID is unavailable." >&2; exit 1; }
          test -n "$TENANT_ID" || { echo "AZURE_TENANT_ID is unavailable." >&2; exit 1; }
          test -n "$SUBSCRIPTION_ID" || { echo "AZURE_SUBSCRIPTION_ID is unavailable." >&2; exit 1; }

          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$TENANT_ID"
          echo "::add-mask::$SUBSCRIPTION_ID"

          {
            echo "client_id=$CLIENT_ID"
            echo "tenant_id=$TENANT_ID"
            echo "subscription_id=$SUBSCRIPTION_ID"
          } >> "$GITHUB_OUTPUT"

          echo "Azure credentials resolved from: $SOURCE"
          echo "Preferred format: three separate repository secrets."

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"

          TOKEN="$(jq -r '.value' <<<"$RESPONSE")"
          test -n "$TOKEN"
          test "$TOKEN" != "null"

          echo "::add-mask::$TOKEN"
          {
            echo "token<<OIDC_EOF"
            echo "$TOKEN"
            echo "OIDC_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "GitHub issued an OIDC token."

      - name: Login to Azure using federated identity
        shell: bash
        run: |
          set -euo pipefail

          az login             --service-principal             --username "${{ steps.azure.outputs.client_id }}"             --tenant "${{ steps.azure.outputs.tenant_id }}"             --federated-token "${{ steps.oidc.outputs.token }}"             --allow-no-subscriptions             --output none

          az account set --subscription "${{ steps.azure.outputs.subscription_id }}"

          az account show             --query "{subscription:id,tenant:tenantId,identity:user.name,type:user.type}"             --output table


      - name: Materialize dedicated persistent Linux host
        shell: bash
        run: |
          set -euo pipefail
          rg=rg-flowed-ideos-lab
          vm=mytrues-project-memory
          suffix="$(az account show --query id -o tsv | sha256sum | cut -c1-10)"
          if ! az vm show -g "$rg" -n "$vm" -o none 2>/dev/null; then
            az vm create -g "$rg" -n "$vm" --location eastus --image Ubuntu2404 --size Standard_B2s --admin-username mytruesadmin --generate-ssh-keys --public-ip-sku Standard --public-ip-address-dns-name "mytrues-memory-$suffix" --nsg-rule NONE --tags project=MyTrues purpose=decision-memory --output none
          fi
          az vm open-port -g "$rg" -n "$vm" --port 80 --priority 1010 -o none
          az vm open-port -g "$rg" -n "$vm" --port 443 --priority 1011 -o none
          host="$(az vm show -d -g "$rg" -n "$vm" --query fqdns -o tsv)"
          printf 'HOST_ENDPOINT=%s\n' "$host"
      - name: Create host-only release decryption key
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mytrues-host-key.sh <<'SH'
          #!/bin/bash
          set -euo pipefail
          install -d -m 700 /var/lib/mytrues
          if [ ! -f /var/lib/mytrues/release-private.pem ]; then
            umask 077
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /var/lib/mytrues/release-private.pem 2>/dev/null
          fi
          echo RELEASE_PUBLIC_KEY_BEGIN
          openssl pkey -in /var/lib/mytrues/release-private.pem -pubout
          echo RELEASE_PUBLIC_KEY_END
          SH
          az vm run-command invoke -g rg-flowed-ideos-lab -n mytrues-project-memory --command-id RunShellScript --scripts @/tmp/mytrues-host-key.sh -o json > /tmp/key-result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/key-result.json'))
          text='\n'.join(x.get('message','') for x in r.get('value',[]))
          assert '-----BEGIN PUBLIC KEY-----' in text
          print(text[text.index('RELEASE_PUBLIC_KEY_BEGIN'):text.index('RELEASE_PUBLIC_KEY_END')+len('RELEASE_PUBLIC_KEY_END')])
          PY
