name: MyTrues Reader domain and GitHub auth

on:
  push:
    branches:
      - tools/ideos-lab
    paths:
      - ".github/workflows/mytrues-reader-domain-auth.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}
  GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
  GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Resolve Azure identifiers
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          extract() {
            local key="$1"
            printf '%s\n' "$AZURE_BUNDLE" |
              sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*[:=][[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\\2/p" |
              tail -n 1
          }
          CLIENT_ID="$(extract AZURE_CLIENT_ID)"
          TENANT_ID="$(extract AZURE_TENANT_ID)"
          SUBSCRIPTION_ID="$(extract AZURE_SUBSCRIPTION_ID)"
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" && test -n "$SUBSCRIPTION_ID"
          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$TENANT_ID"
          echo "::add-mask::$SUBSCRIPTION_ID"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"
          TOKEN="$(jq -r '.value' <<<"$RESPONSE")"
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          {
            echo "token<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login Azure
        shell: bash
        run: |
          set -euo pipefail
          az login --service-principal             --username "${{ steps.azure.outputs.client_id }}"             --tenant "${{ steps.azure.outputs.tenant_id }}"             --federated-token "${{ steps.oidc.outputs.token }}"             --allow-no-subscriptions -o none
          az account set --subscription "${{ steps.azure.outputs.subscription_id }}"

      - name: Validate apex DNS
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          rg=rg-flowed-ideos-lab
          env=mytrues-memory-env
          app=mytrues-reader
          domain=mytrues.io

          expected_ip="$(az containerapp env show -g "$rg" -n "$env" --query properties.staticIp -o tsv)"
          expected_txt="$(az containerapp show -g "$rg" -n "$app" --query properties.customDomainVerificationId -o tsv)"
          actual_ips="$(dig +short A "$domain" | sort -u | tr '\n' ' ')"
          actual_txt="$(dig +short TXT asuid.$domain | tr -d '\"' | tr '\n' ' ')"

          echo "expected_ip=$expected_ip"
          echo "actual_ips=$actual_ips"
          echo "expected_txt=$expected_txt"
          echo "actual_txt=$actual_txt"

          if ! printf '%s\n' "$actual_ips" | grep -Fq "$expected_ip" || [ "$actual_txt" != "$expected_txt" ]; then
            {
              echo "## Reader DNS pending"
              echo
              echo "Configure Cloudflare as **DNS only**:"
              echo "- A `@` -> `$expected_ip`"
              echo "- TXT `asuid` -> `$expected_txt`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Bind mytrues.io and managed TLS
        if: steps.dns.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rg=rg-flowed-ideos-lab
          app=mytrues-reader
          env=mytrues-memory-env
          domain=mytrues.io

          if ! az containerapp show -g "$rg" -n "$app" --query "properties.configuration.ingress.customDomains[?name=='$domain'].name | [0]" -o tsv | grep -qx "$domain"; then
            az containerapp hostname add -g "$rg" -n "$app" --hostname "$domain" --only-show-errors -o none
          fi

          az containerapp hostname bind             -g "$rg" -n "$app"             --hostname "$domain"             --environment "$env"             --validation-method HTTP             --only-show-errors -o none

          for i in $(seq 1 60); do
            if curl -fsS --max-time 15 "https://$domain/" -o /tmp/domain.html; then
              break
            fi
            sleep 5
          done
          grep -q '<title>MyTrues · Human Reader</title>' /tmp/domain.html
          echo "DOMAIN_TLS_PASS=https://$domain/"

      - name: Check GitHub OAuth secrets
        if: steps.dns.outputs.ready == 'true'
        id: oauth
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_OAUTH_CLIENT_ID" ] || [ -z "$GITHUB_OAUTH_CLIENT_SECRET" ]; then
            {
              echo "## GitHub OAuth pending"
              echo
              echo "Add repository secrets:"
              echo "- `GITHUB_OAUTH_CLIENT_ID`"
              echo "- `GITHUB_OAUTH_CLIENT_SECRET`"
              echo
              echo "OAuth homepage: `https://mytrues.io/`"
              echo "OAuth callback: `https://mytrues.io/.auth/login/github/callback`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$GITHUB_OAUTH_CLIENT_ID"
          echo "::add-mask::$GITHUB_OAUTH_CLIENT_SECRET"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Enable GitHub OAuth on Reader
        if: steps.dns.outputs.ready == 'true' && steps.oauth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rg=rg-flowed-ideos-lab
          app=mytrues-reader

          az containerapp auth github update             -g "$rg" -n "$app"             --client-id "$GITHUB_OAUTH_CLIENT_ID"             --client-secret "$GITHUB_OAUTH_CLIENT_SECRET"             --yes --only-show-errors -o none

          az containerapp auth update             -g "$rg" -n "$app"             --enabled true             --unauthenticated-client-action RedirectToLoginPage             --redirect-provider GitHub             --require-https true             --token-store true             --yes --only-show-errors -o none

          az containerapp auth show -g "$rg" -n "$app"             --query '{enabled:platform.enabled,action:globalValidation.unauthenticatedClientAction,provider:globalValidation.redirectToProvider,githubConfigured:identityProviders.gitHub.registration.clientId!=null}'             -o json

      - name: Verify login gate
        if: steps.dns.outputs.ready == 'true' && steps.oauth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sS -D - -o /dev/null --max-time 15 https://mytrues.io/)"
          code="$(printf '%s\n' "$headers" | awk 'toupper($1) ~ /^HTTP/ {c=$2} END {print c}')"
          location="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}')"
          printf 'HTTP=%s\nLOCATION=%s\n' "$code" "$location"
          test "$code" = "302" -o "$code" = "303"
          printf '%s' "$location" | grep -qi '/.auth/login/github'
          echo "GITHUB_AUTH_GATE_PASS"
