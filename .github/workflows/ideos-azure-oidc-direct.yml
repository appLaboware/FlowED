name: IDEOS Azure OIDC direct proof

on:
  push:
    branches:
      - tools/ideos-lab
    paths:
      - ".github/workflows/ideos-azure-oidc-direct.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-flowed-ideos-lab
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  prove-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify Azure identifiers are configured
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          echo "Azure identifiers are present."

      - name: Request GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"

          TOKEN="$(jq -r '.value' <<<"$RESPONSE")"
          test -n "$TOKEN"
          test "$TOKEN" != "null"

          echo "::add-mask::$TOKEN"
          {
            echo "token<<OIDC_EOF"
            echo "$TOKEN"
            echo "OIDC_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "GitHub issued an OIDC token."

      - name: Login to Azure using federated identity
        run: |
          set -euo pipefail

          az login             --service-principal             --username "$AZURE_CLIENT_ID"             --tenant "$AZURE_TENANT_ID"             --federated-token "${{ steps.oidc.outputs.token }}"             --allow-no-subscriptions             --output none

          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

          az account show             --query "{subscription:id,tenant:tenantId,identity:user.name,type:user.type}"             --output json

      - name: Prove read access to laboratory resource group
        id: rg
        run: |
          set -euo pipefail

          RG_ID="$(az group show             --name "$RESOURCE_GROUP"             --query id             --output tsv)"

          test -n "$RG_ID"
          echo "resource_group_id=$RG_ID" >> "$GITHUB_OUTPUT"

          az group show             --name "$RESOURCE_GROUP"             --query "{name:name,location:location,id:id}"             --output table

      - name: Prove Contributor write access with empty ARM deployment
        id: write
        run: |
          set -euo pipefail

          DEPLOYMENT="ideos-oidc-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "deployment=$DEPLOYMENT" >> "$GITHUB_OUTPUT"

          cat > /tmp/empty-template.json <<'JSON'
          {
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
            "contentVersion": "1.0.0.0",
            "resources": []
          }
          JSON

          az deployment group create             --resource-group "$RESOURCE_GROUP"             --name "$DEPLOYMENT"             --template-file /tmp/empty-template.json             --output none

          STATE="$(az deployment group show             --resource-group "$RESOURCE_GROUP"             --name "$DEPLOYMENT"             --query properties.provisioningState             --output tsv)"

          test "$STATE" = "Succeeded"
          echo "Azure accepted a write operation through GitHub OIDC."

      - name: Remove proof deployment record
        if: always() && steps.write.outputs.deployment != ''
        run: |
          az deployment group delete             --resource-group "$RESOURCE_GROUP"             --name "${{ steps.write.outputs.deployment }}" || true

      - name: Final proof
        if: success()
        run: |
          echo "PROVED: GitHub OIDC -> Azure authentication -> RG read -> Contributor write."
