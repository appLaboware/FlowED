name: MyTrues open MVP conformance

on:
  push:
    branches: [tools/ideos-lab]
    paths:
      - "Tools/MYTRUES/**"
      - ".github/workflows/mytrues-protocol-conformance.yml"
  workflow_dispatch:

concurrency:
  group: mytrues-protocol-conformance
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone repository
        run: git clone --depth 1 --branch tools/ideos-lab https://github.com/appLaboware/FlowED.git repo

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Start two independent provider MyTrues
        working-directory: repo/Tools/MYTRUES
        run: docker compose up -d --build

      - name: Prove v0.2 schema and behavior conformance
        working-directory: repo/Tools/MYTRUES
        run: |
          python3 conformance/test_protocol.py | tee /tmp/mytrues-conformance-v0.2.json

      - name: Assert product baseline
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/mytrues-conformance-v0.2.json"))
          assert x["protocol"]=="PASS"
          assert x["schema_version"]=="0.2"
          assert all(v=="PASS" for v in x["schema_conformance"].values())
          assert x["anonymization"]=="PASS"
          assert x["persistent_provider_memory"]=="PASS"
          print("MYTRUES V0.2 SCHEMAS: PASS")
          print("TWO INDEPENDENT PROVIDER MYTRUES: PASS")
          print("UNKNOWN CASE PAUSES: PASS")
          print("HUMAN TEACH -> RESUME: PASS")
          print("PROVIDER-SCOPED LEARNING: PASS")
          print("MEMORY SURVIVES RESTART: PASS")
          print("ANONYMIZED CASE PACKET: PASS")
          print("PROPRIETARY CORE REQUIRED: NO")
          PY

      - name: Shutdown
        if: always()
        working-directory: repo/Tools/MYTRUES
        run: docker compose down -v
