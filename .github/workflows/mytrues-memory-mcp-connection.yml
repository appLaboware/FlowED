name: MyTrues Memory MCP connection secret

on:
  push:
    branches: [tools/ideos-lab]
    paths: ['.github/workflows/mytrues-memory-mcp-connection.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Resolve Azure identifiers
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          extract(){ local key="$1"; printf '%s\n' "$AZURE_BUNDLE" | sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*[:=][[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\\2/p" | tail -n1; }
          CLIENT_ID="$(extract AZURE_CLIENT_ID)"
          TENANT_ID="$(extract AZURE_TENANT_ID)"
          SUBSCRIPTION_ID="$(extract AZURE_SUBSCRIPTION_ID)"
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" && test -n "$SUBSCRIPTION_ID"
          echo "::add-mask::$CLIENT_ID"; echo "::add-mask::$TENANT_ID"; echo "::add-mask::$SUBSCRIPTION_ID"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Azure OIDC login
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$TOKEN"
          az login --service-principal --username "${{ steps.azure.outputs.client_id }}" --tenant "${{ steps.azure.outputs.tenant_id }}" --federated-token "$TOKEN" --allow-no-subscriptions -o none
          az account set --subscription "${{ steps.azure.outputs.subscription_id }}"

      - name: Publish full MCP endpoint as Key Vault secret
        shell: bash
        run: |
          set -euo pipefail
          vault=mytrues-ingest-kv
          cap="$(az keyvault secret show --vault-name "$vault" -n reader-mcp-capability --query value -o tsv)"
          test -n "$cap"
          endpoint="https://mytrues-reader.ambitioushill-c7dc3aef.brazilsouth.azurecontainerapps.io/mcp/$cap"
          echo "::add-mask::$cap"
          echo "::add-mask::$endpoint"
          az keyvault secret set --vault-name "$vault" -n reader-mcp-endpoint --value "$endpoint" --only-show-errors -o none

          curl -fsS -H 'content-type: application/json' --data @- "$endpoint" <<'JSON' >/tmp/tools.json
          {"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}
          JSON
          jq -e '.result.tools | length == 4' /tmp/tools.json >/dev/null
          echo "MEMORY_MCP_ENDPOINT_SECRET_READY"
          echo "vault=$vault"
          echo "secret=reader-mcp-endpoint"
