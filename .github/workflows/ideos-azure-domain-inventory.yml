name: IDEOS Azure domain inventory

on:
  push:
    branches:
      - tools/ideos-lab
    paths:
      - ".github/workflows/ideos-azure-domain-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}
  AZURE_CLIENT_ID_SECRET: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID_SECRET: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID_SECRET: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve Azure credentials
        id: azctx
        shell: bash
        run: |
          set -euo pipefail

          get_bundle_value() {
            local key="$1"
            printf '%s\n' "$AZURE_BUNDLE" |
              sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*=[[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\2/p" |
              tail -n 1
          }

          CLIENT_ID="$AZURE_CLIENT_ID_SECRET"
          TENANT_ID="$AZURE_TENANT_ID_SECRET"
          SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID_SECRET"

          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ] || [ -z "$SUBSCRIPTION_ID" ]; then
            CLIENT_ID="${CLIENT_ID:-$(get_bundle_value AZURE_CLIENT_ID)}"
            TENANT_ID="${TENANT_ID:-$(get_bundle_value AZURE_TENANT_ID)}"
            SUBSCRIPTION_ID="${SUBSCRIPTION_ID:-$(get_bundle_value AZURE_SUBSCRIPTION_ID)}"
          fi

          test -n "$CLIENT_ID"
          test -n "$TENANT_ID"
          test -n "$SUBSCRIPTION_ID"

          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$TENANT_ID"
          echo "::add-mask::$SUBSCRIPTION_ID"

          {
            echo "client_id=$CLIENT_ID"
            echo "tenant_id=$TENANT_ID"
            echo "subscription_id=$SUBSCRIPTION_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"
          TOKEN="$(jq -r '.value' <<<"$RESPONSE")"
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          {
            echo "token<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Azure
        run: |
          az login             --service-principal             --username "${{ steps.azctx.outputs.client_id }}"             --tenant "${{ steps.azctx.outputs.tenant_id }}"             --federated-token "${{ steps.oidc.outputs.token }}"             --output none
          az account set --subscription "${{ steps.azctx.outputs.subscription_id }}"

      - name: Inventory resources and hostnames
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Resource groups ==="
          az group list --query "[].{name:name,location:location}" -o table

          echo
          echo "=== Web Apps / hostnames ==="
          az webapp list             --query "[].{name:name,rg:resourceGroup,defaultHost:defaultHostName,hostNames:hostNames}"             -o json || true

          echo
          echo "=== Container Apps / FQDN and custom domains ==="
          az containerapp list             --query "[].{name:name,rg:resourceGroup,fqdn:properties.configuration.ingress.fqdn,customDomains:properties.configuration.ingress.customDomains}"             -o json || true

          echo
          echo "=== Container Instances / FQDN ==="
          az container list             --query "[].{name:name,rg:resourceGroup,fqdn:ipAddress.fqdn,ip:ipAddress.ip}"             -o json || true

          echo
          echo "=== Resources mentioning me.dev.br ==="
          az resource list -o json |
            jq '[.[] | select((tostring | ascii_downcase) | contains("me.dev.br")) |
                 {name,resourceGroup,type,id}]'
