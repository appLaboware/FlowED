name: MyTrues TypeDB Azure POC

on:
  push:
    branches:
      - tools/ideos-lab
    paths:
      - ".github/workflows/mytrues-typedb-poc.yml"
      - "Tools/MyTrues/typedb-poc-bridge/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve Azure identifiers from repository secret
        id: azure
        shell: bash
        env:
          AZURE_RAW: ${{ secrets.AZURE }}
        run: |
          set -euo pipefail
          extract() {
            local key="$1"
            printf '%s\n' "$AZURE_RAW" |
              sed -nE "s/^[[:space:]]*$key[[:space:]]*[:=][[:space:]]*(.*)[[:space:]]*$/\\1/p" |
              tail -n 1
          }

          CLIENT_ID="$(extract AZURE_CLIENT_ID)"
          TENANT_ID="$(extract AZURE_TENANT_ID)"
          SUBSCRIPTION_ID="$(extract AZURE_SUBSCRIPTION_ID)"

          test -n "$CLIENT_ID" || { echo "AZURE_CLIENT_ID not found in secret AZURE" >&2; exit 1; }
          test -n "$TENANT_ID" || { echo "AZURE_TENANT_ID not found in secret AZURE" >&2; exit 1; }
          test -n "$SUBSCRIPTION_ID" || { echo "AZURE_SUBSCRIPTION_ID not found in secret AZURE" >&2; exit 1; }

          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$TENANT_ID"
          echo "::add-mask::$SUBSCRIPTION_ID"

          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token directly
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"
          TOKEN="$(jq -r '.value' <<<"$RESPONSE")"
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          {
            echo "token<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Azure CLI without external action
        shell: bash
        run: |
          set -euo pipefail
          az login \
            --service-principal \
            --username "${{ steps.azure.outputs.client_id }}" \
            --tenant "${{ steps.azure.outputs.tenant_id }}" \
            --federated-token "${{ steps.oidc.outputs.token }}" \
            --allow-no-subscriptions \
            --output none
          az account set --subscription "${{ steps.azure.outputs.subscription_id }}"

      - name: Verify Azure identity and laboratory resource group
        shell: bash
        run: |
          set -euo pipefail
          az account show --query '{subscription:id,tenant:tenantId,type:user.type}' -o json
          az group show --name rg-flowed-ideos-lab --query '{name:name,location:location}' -o json
          echo "AZURE_AUTH_OK"

      - name: Deploy persistent TypeDB POC
        shell: bash
        env:
          BRIDGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/appLaboware/FlowED/$BRIDGE_SHA/Tools/MyTrues/typedb-poc-bridge/deploy-azure.sh"
          curl -fsSL "$url" -o /tmp/deploy-azure.sh
          chmod +x /tmp/deploy-azure.sh
          /tmp/deploy-azure.sh
