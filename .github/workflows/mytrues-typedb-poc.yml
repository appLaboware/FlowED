name: MyTrues TypeDB Azure POC
on:
  push:
    branches: [tools/ideos-lab]
    paths: ['.github/workflows/mytrues-typedb-poc.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Azure repository credentials
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          get_bundle_value() {
            local key="$1"
            printf '%s\n' "$AZURE_BUNDLE" |
              sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*[:=][[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\\2/p" |
              tail -n 1
          }
          CLIENT_ID="$(get_bundle_value AZURE_CLIENT_ID)"
          TENANT_ID="$(get_bundle_value AZURE_TENANT_ID)"
          SUBSCRIPTION_ID="$(get_bundle_value AZURE_SUBSCRIPTION_ID)"
          test -n "$CLIENT_ID"
          test -n "$TENANT_ID"
          test -n "$SUBSCRIPTION_ID"
          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$TENANT_ID"
          echo "::add-mask::$SUBSCRIPTION_ID"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"
          TOKEN="$(jq -r '.value' <<<"$RESPONSE")"
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "token<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TOKEN" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Login to Azure using federated identity
        shell: bash
        run: |
          set -euo pipefail
          az login --service-principal             --username "${{ steps.azure.outputs.client_id }}"             --tenant "${{ steps.azure.outputs.tenant_id }}"             --federated-token "${{ steps.oidc.outputs.token }}"             --allow-no-subscriptions --output none
          az account set --subscription "${{ steps.azure.outputs.subscription_id }}"
          az group show -n rg-flowed-ideos-lab --query '{name:name,location:location}' -o json

      - name: Azure probe passed
        run: echo "AZURE_AUTH_OK"
