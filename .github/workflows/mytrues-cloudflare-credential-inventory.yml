name: MyTrues Cloudflare credential inventory

on:
  push:
    branches: [tools/ideos-lab]
    paths: ['.github/workflows/mytrues-cloudflare-credential-inventory.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}
  CF_DNS_EDIT_REPO: ${{ secrets.CF_DNS_EDIT }}
  CF_ZONE_READ_REPO: ${{ secrets.CF_ZONE_READ }}
  CLOUDFLARE_BUNDLE_REPO: ${{ secrets.CLOUDFLARE }}

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Report GitHub secret presence without values
        shell: bash
        run: |
          set -euo pipefail
          present(){ [ -n "$2" ] && echo "$1=PRESENT" || echo "$1=ABSENT"; }
          present CF_DNS_EDIT "$CF_DNS_EDIT_REPO"
          present CF_ZONE_READ "$CF_ZONE_READ_REPO"
          present CLOUDFLARE "$CLOUDFLARE_BUNDLE_REPO"

      - name: Resolve Azure identifiers
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          extract(){ local key="$1"; printf '%s\n' "$AZURE_BUNDLE" | sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*[:=][[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\\2/p" | tail -n1; }
          CLIENT_ID="$(extract AZURE_CLIENT_ID)"
          TENANT_ID="$(extract AZURE_TENANT_ID)"
          SUBSCRIPTION_ID="$(extract AZURE_SUBSCRIPTION_ID)"
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" && test -n "$SUBSCRIPTION_ID"
          echo "::add-mask::$CLIENT_ID"; echo "::add-mask::$TENANT_ID"; echo "::add-mask::$SUBSCRIPTION_ID"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: GitHub OIDC and Azure login
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          test -n "$TOKEN" && test "$TOKEN" != null
          echo "::add-mask::$TOKEN"
          az login --service-principal --username "${{ steps.azure.outputs.client_id }}" --tenant "${{ steps.azure.outputs.tenant_id }}" --federated-token "$TOKEN" --allow-no-subscriptions -o none
          az account set --subscription "${{ steps.azure.outputs.subscription_id }}"

      - name: Search Azure Key Vault secret names only
        shell: bash
        run: |
          set -euo pipefail
          vault=mytrues-ingest-kv
          echo "=== matching secret names in $vault ==="
          az keyvault secret list --vault-name "$vault" --query "[].name" -o tsv | grep -Ei 'cloudflare|cf[-_]|dns|zone' || true
