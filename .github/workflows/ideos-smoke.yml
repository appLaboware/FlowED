name: IDEOS Actions smoke

on:
  push:
    branches:
      - tools/ideos-lab
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Smoke
        run: |
          echo "IDEOS GitHub Actions runner is alive"
          test -f Tools/IDEOS/README.md
          docker version
