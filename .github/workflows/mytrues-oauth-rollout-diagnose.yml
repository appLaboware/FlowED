name: MyTrues OAuth rollout diagnose

on:
  push:
    branches: [tools/ideos-lab]
    paths: ['.github/workflows/mytrues-oauth-rollout-diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve Azure
        id: az
        shell: bash
        run: |
          set -euo pipefail
          extract(){ local key="$1"; printf '%s\n' "$AZURE_BUNDLE" | sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*[:=][[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\\2/p" | tail -n1; }
          C="$(extract AZURE_CLIENT_ID)"; T="$(extract AZURE_TENANT_ID)"; S="$(extract AZURE_SUBSCRIPTION_ID)"
          test -n "$C" && test -n "$T" && test -n "$S"
          echo "::add-mask::$C"; echo "::add-mask::$T"; echo "::add-mask::$S"
          echo "c=$C" >> "$GITHUB_OUTPUT"; echo "t=$T" >> "$GITHUB_OUTPUT"; echo "s=$S" >> "$GITHUB_OUTPUT"
      - name: Login
        shell: bash
        run: |
          set -euo pipefail
          tok="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$tok"
          az login --service-principal --username "${{ steps.az.outputs.c }}" --tenant "${{ steps.az.outputs.t }}" --federated-token "$tok" --allow-no-subscriptions -o none
          az account set --subscription "${{ steps.az.outputs.s }}"
      - name: Inspect rollout
        shell: bash
        run: |
          set -euo pipefail
          rg=rg-flowed-ideos-lab; app=mytrues-mcp
          echo "=== APP ==="
          az containerapp show -g "$rg" -n "$app" --query '{templateImage:properties.template.containers[0].image,latestRevision:properties.latestRevisionName,latestReady:properties.latestReadyRevisionName,traffic:properties.configuration.ingress.traffic}' -o json
          echo "=== REVISIONS ==="
          az containerapp revision list -g "$rg" -n "$app" --query '[].{name:name,active:properties.active,health:properties.healthState,provision:properties.provisioningState,image:properties.template.containers[0].image,created:properties.createdTime}' -o table
          echo "=== DCR READER ==="
          code="$(curl -sS -o /tmp/reg -w '%{http_code}' -H 'content-type: application/json' --data '{"client_name":"Reader rollout diagnose","redirect_uris":["https://reader.mytrues.io/auth/callback"],"grant_types":["authorization_code","refresh_token"],"response_types":["code"],"token_endpoint_auth_method":"none","application_type":"web"}' https://mcp.mytrues.io/register)"
          echo "HTTP=$code"
          jq '{error,error_description,accepted:(.client_id!=null),redirect_uris}' /tmp/reg
