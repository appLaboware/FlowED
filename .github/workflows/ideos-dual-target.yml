name: IDEOS same Application on Docker and Azure

on:
  workflow_dispatch:
  push:
    branches:
      - tools/ideos-lab
    paths:
      - "Tools/IDEOS/experiments/EXP-004-dual-target/**"
      - ".github/workflows/ideos-dual-target.yml"

permissions:
  contents: read
  id-token: write

env:
  EXP_DIR: Tools/IDEOS/experiments/EXP-004-dual-target
  RESOURCE_GROUP: rg-flowed-ideos-lab
  LOCATION: brazilsouth
  INSTANCE_NAME: vitrine
  DNS_LABEL: vitrine-flowed-ideos

jobs:
  docker:
    name: Materialize on Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Deploy the Application
        run: bash "$EXP_DIR/materialize.sh" deploy docker

      - name: Verify the Application
        run: |
          OUTPUT="$(bash "$EXP_DIR/materialize.sh" verify docker)"
          echo "$OUTPUT"
          grep -F "A mesma aplicacao foi materializada pelo mesmo contrato." <<<"$OUTPUT"

      - name: Show endpoint
        run: bash "$EXP_DIR/materialize.sh" endpoint docker

      - name: Destroy
        if: always()
        run: bash "$EXP_DIR/materialize.sh" destroy docker

  azure:
    name: Materialize on Azure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Read Azure identifiers from repository secret
        id: azure
        shell: bash
        env:
          AZURE_RAW: ${{ secrets.AZURE }}
        run: |
          set -euo pipefail

          extract() {
            local key="$1"
            printf '%s\n' "$AZURE_RAW" |
              sed -nE "s/^[[:space:]]*$key[[:space:]]*[:=][[:space:]]*(.*)[[:space:]]*$/\\1/p" |
              tail -n 1
          }

          CLIENT_ID="$(extract AZURE_CLIENT_ID)"
          TENANT_ID="$(extract AZURE_TENANT_ID)"
          SUBSCRIPTION_ID="$(extract AZURE_SUBSCRIPTION_ID)"

          test -n "$CLIENT_ID" || { echo "AZURE_CLIENT_ID not found in secret AZURE" >&2; exit 1; }
          test -n "$TENANT_ID" || { echo "AZURE_TENANT_ID not found in secret AZURE" >&2; exit 1; }
          test -n "$SUBSCRIPTION_ID" || { echo "AZURE_SUBSCRIPTION_ID not found in secret AZURE" >&2; exit 1; }

          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$TENANT_ID"
          echo "::add-mask::$SUBSCRIPTION_ID"

          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ steps.azure.outputs.client_id }}
          tenant-id: ${{ steps.azure.outputs.tenant_id }}
          subscription-id: ${{ steps.azure.outputs.subscription_id }}

      - name: Deploy the same Application
        run: bash "$EXP_DIR/materialize.sh" deploy azure

      - name: Verify the same Application
        run: |
          OUTPUT="$(bash "$EXP_DIR/materialize.sh" verify azure)"
          echo "$OUTPUT"
          grep -F "A mesma aplicacao foi materializada pelo mesmo contrato." <<<"$OUTPUT"

      - name: Return ready URL
        run: |
          URL="$(bash "$EXP_DIR/materialize.sh" endpoint azure)"
          echo "READY_URL=$URL"
          {
            echo "# Aplicação pronta"
            echo
            echo "$URL"
            echo
            echo "A mesma Application foi materializada e validada na Azure."
          } >> "$GITHUB_STEP_SUMMARY"
