name: MyTrues private MCP extension-point inventory

on:
  push:
    branches: [tools/ideos-lab]
    paths: ['.github/workflows/mytrues-private-mcp-extension-inventory.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve Azure identifiers
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          extract(){ local key="$1"; printf '%s\n' "$AZURE_BUNDLE" | sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*[:=][[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\\2/p" | tail -n1; }
          CLIENT_ID="$(extract AZURE_CLIENT_ID)"; TENANT_ID="$(extract AZURE_TENANT_ID)"; SUBSCRIPTION_ID="$(extract AZURE_SUBSCRIPTION_ID)"
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" && test -n "$SUBSCRIPTION_ID"
          echo "::add-mask::$CLIENT_ID"; echo "::add-mask::$TENANT_ID"; echo "::add-mask::$SUBSCRIPTION_ID"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"; echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"; echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Azure OIDC login
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$TOKEN"
          az login --service-principal --username "${{ steps.azure.outputs.client_id }}" --tenant "${{ steps.azure.outputs.tenant_id }}" --federated-token "$TOKEN" --allow-no-subscriptions -o none
          az account set --subscription "${{ steps.azure.outputs.subscription_id }}"

      - name: Inspect decrypted app structure without source disclosure
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet azure-identity==1.25.0 azure-keyvault-keys==4.10.0 cryptography==46.0.0
          python - <<'PY'
          import ast,base64,io,json,os,pathlib,tempfile,zipfile,subprocess
          from azure.identity import AzureCliCredential
          from azure.keyvault.keys.crypto import CryptographyClient,EncryptionAlgorithm
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          # Read the repository payload without ever printing decrypted source.
          obj=json.load(open(".github/mytrues-live-payload.json"))
          client=CryptographyClient(obj["kid"],AzureCliCredential())
          dec=base64.b64decode
          session=client.decrypt(EncryptionAlgorithm.rsa_oaep_256,dec(obj["wrapped_key"])).plaintext
          package=AESGCM(session).decrypt(dec(obj["nonce"]),dec(obj["ciphertext"]),b"mytrues.private-transfer/1")
          archive=zipfile.ZipFile(io.BytesIO(package))

          print("ARCHIVE_FILES", sorted(archive.namelist()))
          for filename in ["app.py","intake.py","registration.py","accounts.py","separation.py","postgres_adapter.py"]:
              src=archive.read(filename).decode()
              tree=ast.parse(src)
              imports=[]
              defs=[]
              decorated=[]
              constants=set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.extend(a.name for a in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imports.append(node.module or "")
                  elif isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)):
                      defs.append(node.name)
                      if getattr(node,"decorator_list",None):
                          decorated.append((node.name,[ast.unparse(d) for d in node.decorator_list]))
                  elif isinstance(node,ast.Constant) and isinstance(node.value,str):
                      s=node.value
                      if any(k in s.lower() for k in ["tool","mcp","memory","oauth","decision","account","namespace","/mcp"]):
                          if len(s)<=180:
                              constants.add(s)
              print("FILE",filename)
              print("IMPORTS",sorted(set(imports)))
              print("DEFS",sorted(set(defs)))
              print("DECORATORS",decorated)
              print("RELEVANT_STRINGS",sorted(constants))
          PY
