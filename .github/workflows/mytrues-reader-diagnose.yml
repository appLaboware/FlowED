name: MyTrues Reader diagnose

on:
  push:
    branches: [tools/ideos-lab]
    paths: ['.github/workflows/mytrues-reader-diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Azure login
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          extract(){ local key="$1"; printf '%s\n' "$AZURE_BUNDLE" | sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*[:=][[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\\2/p" | tail -n1; }
          CID="$(extract AZURE_CLIENT_ID)"; TID="$(extract AZURE_TENANT_ID)"; SID="$(extract AZURE_SUBSCRIPTION_ID)"
          for x in "$CID" "$TID" "$SID"; do echo "::add-mask::$x"; done
          TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$TOKEN"
          az login --service-principal --username "$CID" --tenant "$TID" --federated-token "$TOKEN" --allow-no-subscriptions -o none
          az account set --subscription "$SID"

      - name: Inspect Reader state
        shell: bash
        run: |
          set -euo pipefail
          rg=rg-flowed-ideos-lab
          app=mytrues-reader
          echo "=== APP ==="
          az containerapp show -g "$rg" -n "$app"             --query '{provisioning:properties.provisioningState,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,fqdn:properties.configuration.ingress.fqdn,targetPort:properties.configuration.ingress.targetPort}' -o json
          echo "=== REVISIONS ==="
          az containerapp revision list -g "$rg" -n "$app"             --query '[].{name:name,active:properties.active,health:properties.healthState,provisioning:properties.provisioningState,replicas:properties.replicas,created:properties.createdTime}' -o table
          echo "=== SYSTEM LOGS ==="
          az containerapp logs show -g "$rg" -n "$app" --type system --tail 80 --follow false 2>&1 || true
