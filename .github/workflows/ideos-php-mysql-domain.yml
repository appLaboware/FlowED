name: IDEOS UX generic PHP MySQL to Azure plus domain

on:
  push:
    branches:
      - tools/ideos-lab
    paths:
      - "Tools/IDEOS/experiments/EXP-006-php-mysql-domain/**"
      - ".github/workflows/ideos-php-mysql-domain.yml"
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain under me.dev.br"
        required: false
        default: porter-lab.me.dev.br
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}
  AZURE_CLIENT_ID_SECRET: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID_SECRET: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID_SECRET: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  CLOUDFLARE_BUNDLE: ${{ secrets.CLOUDFLARE }}
  CF_DNS_EDIT_SECRET: ${{ secrets.CF_DNS_EDIT }}
  CF_ZONE_READ_SECRET: ${{ secrets.CF_ZONE_READ }}

jobs:
  one-command:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Clone repository
        run: |
          git clone --depth 1 --branch tools/ideos-lab https://github.com/appLaboware/FlowED.git repo

      - name: Parse provider bootstrap credentials
        id: ctx
        shell: bash
        run: |
          set -euo pipefail

          get_value() {
            local bundle="$1"
            local key="$2"
            printf '%s\n' "$bundle" |
              sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*=[[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\2/p" |
              tail -n 1
          }

          AZURE_CLIENT_ID="$AZURE_CLIENT_ID_SECRET"
          AZURE_TENANT_ID="$AZURE_TENANT_ID_SECRET"
          AZURE_SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID_SECRET"
          AZURE_SOURCE="separate repository secrets"

          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            AZURE_SOURCE="legacy AZURE bundle secret"
            AZURE_CLIENT_ID="${AZURE_CLIENT_ID:-$(get_value "$AZURE_BUNDLE" AZURE_CLIENT_ID)}"
            AZURE_TENANT_ID="${AZURE_TENANT_ID:-$(get_value "$AZURE_BUNDLE" AZURE_TENANT_ID)}"
            AZURE_SUBSCRIPTION_ID="${AZURE_SUBSCRIPTION_ID:-$(get_value "$AZURE_BUNDLE" AZURE_SUBSCRIPTION_ID)}"
          fi

          test -n "$AZURE_CLIENT_ID" || { echo "AZURE_CLIENT_ID is unavailable." >&2; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "AZURE_TENANT_ID is unavailable." >&2; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo "AZURE_SUBSCRIPTION_ID is unavailable." >&2; exit 1; }

          CF_DNS_EDIT="$CF_DNS_EDIT_SECRET"
          CF_ZONE_READ="$CF_ZONE_READ_SECRET"
          CF_SOURCE="separate repository secrets"

          if [ -z "$CF_DNS_EDIT" ] || [ -z "$CF_ZONE_READ" ]; then
            CF_SOURCE="legacy CLOUDFLARE bundle secret"
            CF_DNS_EDIT="${CF_DNS_EDIT:-$(get_value "$CLOUDFLARE_BUNDLE" CF_DNS_EDIT)}"
            CF_ZONE_READ="${CF_ZONE_READ:-$(get_value "$CLOUDFLARE_BUNDLE" CF_ZONE_READ)}"
          fi

          test -n "$CF_DNS_EDIT" || { echo "CF_DNS_EDIT is unavailable." >&2; exit 1; }
          test -n "$CF_ZONE_READ" || { echo "CF_ZONE_READ is unavailable." >&2; exit 1; }

          for value in "$AZURE_CLIENT_ID" "$AZURE_TENANT_ID" "$AZURE_SUBSCRIPTION_ID" "$CF_DNS_EDIT" "$CF_ZONE_READ"; do
            test -n "$value"
            echo "::add-mask::$value"
          done

          DOMAIN="${{ inputs.domain }}"
          if [ -z "$DOMAIN" ]; then
            DOMAIN="porter-lab.me.dev.br"
          fi

          SITE_NAME="phpmysql-${GITHUB_RUN_ID}"
          SITE_NAME="${SITE_NAME:0:50}"

          {
            echo "azure_client_id=$AZURE_CLIENT_ID"
            echo "azure_tenant_id=$AZURE_TENANT_ID"
            echo "azure_subscription_id=$AZURE_SUBSCRIPTION_ID"
            echo "cf_dns_edit=$CF_DNS_EDIT"
            echo "cf_zone_read=$CF_ZONE_READ"
            echo "domain=$DOMAIN"
            echo "site_name=$SITE_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Azure credentials resolved from: $AZURE_SOURCE"
          echo "Cloudflare credentials resolved from: $CF_SOURCE"
          echo "Intent: deploy generic PHP+MySQL application at http://$DOMAIN"

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"

          TOKEN="$(jq -r '.value' <<<"$RESPONSE")"
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"

          {
            echo "token<<OIDC_EOF"
            echo "$TOKEN"
            echo "OIDC_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Porter and official Azure mixin
        run: |
          curl -fsSL https://cdn.porter.sh/latest/install-linux.sh | bash
          "$HOME/.porter/porter" mixin install az
          "$HOME/.porter/porter" version
          "$HOME/.porter/porter" mixins list

      - name: Package the application artifact
        run: |
          tar -C repo/Tools/IDEOS/experiments/EXP-006-php-mysql-domain/app             -czf /tmp/site.tar.gz .

      - name: Configure Porter credential set
        env:
          AZURE_CLIENT_ID: ${{ steps.ctx.outputs.azure_client_id }}
          AZURE_TENANT_ID: ${{ steps.ctx.outputs.azure_tenant_id }}
          AZURE_SUBSCRIPTION_ID: ${{ steps.ctx.outputs.azure_subscription_id }}
          AZURE_FEDERATED_TOKEN: ${{ steps.oidc.outputs.token }}
          CF_DNS_EDIT: ${{ steps.ctx.outputs.cf_dns_edit }}
          CF_ZONE_READ: ${{ steps.ctx.outputs.cf_zone_read }}
        run: |
          cat >/tmp/cloud.yaml <<'YAML'
          schemaType: CredentialSet
          schemaVersion: 1.0.1
          name: cloud
          credentials:
            - name: azure-client-id
              source:
                env: AZURE_CLIENT_ID
            - name: azure-tenant-id
              source:
                env: AZURE_TENANT_ID
            - name: azure-subscription-id
              source:
                env: AZURE_SUBSCRIPTION_ID
            - name: azure-federated-token
              source:
                env: AZURE_FEDERATED_TOKEN
            - name: cloudflare-zone-read
              source:
                env: CF_ZONE_READ
            - name: cloudflare-dns-edit
              source:
                env: CF_DNS_EDIT
          YAML

          "$HOME/.porter/porter" credentials apply /tmp/cloud.yaml

      - name: ONE USER COMMAND - materialize application
        env:
          AZURE_CLIENT_ID: ${{ steps.ctx.outputs.azure_client_id }}
          AZURE_TENANT_ID: ${{ steps.ctx.outputs.azure_tenant_id }}
          AZURE_SUBSCRIPTION_ID: ${{ steps.ctx.outputs.azure_subscription_id }}
          AZURE_FEDERATED_TOKEN: ${{ steps.oidc.outputs.token }}
          CF_DNS_EDIT: ${{ steps.ctx.outputs.cf_dns_edit }}
          CF_ZONE_READ: ${{ steps.ctx.outputs.cf_zone_read }}
        run: |
          cd repo/Tools/IDEOS/experiments/EXP-006-php-mysql-domain

          echo "USER COMMAND:"
          echo "porter install site -c cloud --param app=./site.tar.gz --param site_name=${{ steps.ctx.outputs.site_name }} --param domain=${{ steps.ctx.outputs.domain }}"

          "$HOME/.porter/porter" install site             -c cloud             --param app=/tmp/site.tar.gz             --param site_name="${{ steps.ctx.outputs.site_name }}"             --param domain="${{ steps.ctx.outputs.domain }}"

      - name: Final proof
        run: |
          echo "SITE: http://${{ steps.ctx.outputs.domain }}"
          curl -fsS --max-time 15 "http://${{ steps.ctx.outputs.domain }}" |
            grep -F "PHP + MySQL materializados no Azure"
