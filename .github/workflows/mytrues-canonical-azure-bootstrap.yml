name: MyTrues Azure canonical identity bootstrap
on:
  push:
    branches: [tools/ideos-lab]
    paths: ['.github/workflows/mytrues-canonical-azure-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AZURE_BUNDLE: ${{ secrets.AZURE }}
  AZURE_CLIENT_ID_SECRET: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID_SECRET: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID_SECRET: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve Azure repository credentials
        id: azure
        shell: bash
        run: |
          set -euo pipefail

          get_bundle_value() {
            local key="$1"
            printf '%s\n' "$AZURE_BUNDLE" |
              sed -nE "s/^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*=[[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\2/p" |
              tail -n 1
          }

          CLIENT_ID="$AZURE_CLIENT_ID_SECRET"
          TENANT_ID="$AZURE_TENANT_ID_SECRET"
          SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID_SECRET"
          SOURCE="separate repository secrets"

          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ] || [ -z "$SUBSCRIPTION_ID" ]; then
            SOURCE="legacy AZURE bundle secret"
            CLIENT_ID="${CLIENT_ID:-$(get_bundle_value AZURE_CLIENT_ID)}"
            TENANT_ID="${TENANT_ID:-$(get_bundle_value AZURE_TENANT_ID)}"
            SUBSCRIPTION_ID="${SUBSCRIPTION_ID:-$(get_bundle_value AZURE_SUBSCRIPTION_ID)}"
          fi

          test -n "$CLIENT_ID" || { echo "AZURE_CLIENT_ID is unavailable." >&2; exit 1; }
          test -n "$TENANT_ID" || { echo "AZURE_TENANT_ID is unavailable." >&2; exit 1; }
          test -n "$SUBSCRIPTION_ID" || { echo "AZURE_SUBSCRIPTION_ID is unavailable." >&2; exit 1; }

          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$TENANT_ID"
          echo "::add-mask::$SUBSCRIPTION_ID"

          {
            echo "client_id=$CLIENT_ID"
            echo "tenant_id=$TENANT_ID"
            echo "subscription_id=$SUBSCRIPTION_ID"
          } >> "$GITHUB_OUTPUT"

          echo "Azure credentials resolved from: $SOURCE"
          echo "Preferred format: three separate repository secrets."


      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ steps.azure.outputs.client_id }}
          tenant-id: ${{ steps.azure.outputs.tenant_id }}
          subscription-id: ${{ steps.azure.outputs.subscription_id }}
      - name: Verify same permitted laboratory
        run: az group show -n rg-flowed-ideos-lab --query '{name:name,location:location}' -o json
      - name: Authorize canonical main federation when existing identity permits it
        env:
          CLIENT_ID: ${{ steps.azure.outputs.client_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mytrues-federation.json <<'JSON'
          {"name":"mytrues-canonical-main","issuer":"https://token.actions.githubusercontent.com","subject":"repo:MyTrues/mytrues:ref:refs/heads/main","audiences":["api://AzureADTokenExchange"]}
          JSON
          if ! az ad app federated-credential list --id "$CLIENT_ID" -o json > /tmp/existing-federation.json 2>/tmp/federation-error; then
            echo "Azure deployment login works, but identity cannot read application federation."
            echo "CANONICAL_FEDERATION=BLOCKED_GRAPH_PERMISSION"
            exit 1
          fi
          if ! jq -e '.[] | select(.subject=="repo:MyTrues/mytrues:ref:refs/heads/main" and .issuer=="https://token.actions.githubusercontent.com")' /tmp/existing-federation.json >/dev/null; then
            if ! az ad app federated-credential create --id "$CLIENT_ID" --parameters /tmp/mytrues-federation.json -o none 2>/tmp/federation-error; then
              echo "Azure deployment login works, but identity cannot add canonical federation."
              echo "CANONICAL_FEDERATION=BLOCKED_GRAPH_PERMISSION"
              exit 1
            fi
          fi
          echo "CANONICAL_FEDERATION=READY"
      - name: Prepare identifiers for authorized canonical configuration transfer
        if: success()
        env:
          CLIENT_ID: ${{ steps.azure.outputs.client_id }}
          TENANT_ID: ${{ steps.azure.outputs.tenant_id }}
          SUBSCRIPTION_ID: ${{ steps.azure.outputs.subscription_id }}
        shell: python
        run: |
          import os,json
          # Only public resource identifiers, never secret bundle/password/tokens.
          json.dump({k:os.environ[v] for k,v in {"client_id":"CLIENT_ID","tenant_id":"TENANT_ID","subscription_id":"SUBSCRIPTION_ID"}.items()},open("/tmp/azure-identifiers.json","w"))
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: canonical-azure-public-identifiers
          path: /tmp/azure-identifiers.json
          retention-days: 1
