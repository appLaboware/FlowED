schemaType: Bundle
schemaVersion: 1.0.1
name: r1-parent
version: 0.1.0
description: "R1 dependency version selection and output wiring fixture"
registry: localhost:5000

mixins:
  - exec

dependencies:
  requires:
    - name: child
      bundle:
        reference: localhost:5000/r1-child:v1.0.0
        version: ">=1.0.0 <2.0.0"

outputs:
  - name: parent_result
    type: string
    path: /cnab/app/parent-result.txt
    applyTo:
      - install

install:
  - exec:
      description: "Materialize the selected dependency output into the parent output"
      command: /bin/sh
      arguments:
        - -c
        - |
          printf '%s\n' '${ bundle.dependencies.child.outputs.child_result }' > /cnab/app/parent-result.txt
          echo "PARENT_SEES=${ bundle.dependencies.child.outputs.child_result }"

uninstall:
  - exec:
      command: /bin/echo
      arguments:
        - PARENT_UNINSTALL
