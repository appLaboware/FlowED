services:
  ideos:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    working_dir: /workspace/IDEOS
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      PORTER_HOME: /root/.porter
      PORTER_ALLOW_DOCKER_HOST_ACCESS: "true"
    volumes:
      - ..:/workspace/IDEOS
      - /var/run/docker.sock:/var/run/docker.sock
    stdin_open: true
    tty: true
