version: "3.8"

services:
  web:
    image: ideos-exp001-web:local
    container_name: ideos-exp001-web
    ports:
      - "18080:80"
    environment:
      DB_HOST: db
      DB_NAME: ideos
      DB_USER: ideos
      DB_PASSWORD: ideos
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: ideos-exp001-db
    environment:
      MYSQL_DATABASE: ideos
      MYSQL_USER: ideos
      MYSQL_PASSWORD: ideos
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
