<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e9">
<meta name="color-scheme" content="light">
<title>MyTrues</title>
<meta name="description" content="Estamos preparando algo incrível para você.">
<link rel="stylesheet" href="/assets/css/public.css">
</head>
<body>
<canvas id="ambient" class="ambient" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<main class="page">
  <header class="header">
    <a class="brand" href="/" aria-label="MyTrues">
      <img src="/assets/mytrues-logo.png" alt="">
      <span>MyTrues</span>
    </a>
    <nav class="micro-nav">
      <button id="lang" type="button">EN</button>
      <a href="/app" data-i18n-aria="access_aria"><span data-i18n="access">Acesso</span></a>
    </nav>
  </header>
  <section class="hero">
    <div class="copy">
      <p class="overline" data-i18n="status">Em preparação</p>
      <h1><span data-i18n="headline_a">Estamos preparando</span><span class="accent-line" data-i18n="headline_b">algo incrível.</span></h1>
      <p class="lead" data-i18n="lead">Se quiser acompanhar de perto, deixe seu nome. Quando chegar a hora, você vai saber.</p>
    </div>
    <div class="interest">
      <form id="interest-form" class="interest-form" novalidate>
        <label class="line-field"><span data-i18n="name_label">Nome</span><input id="name" name="name" maxlength="120" autocomplete="name" data-i18n-placeholder="name_placeholder" placeholder="Seu nome" required></label>
        <label class="line-field"><span data-i18n="email_label">E-mail</span><input id="email" name="email" type="email" maxlength="240" autocomplete="email" data-i18n-placeholder="email_placeholder" placeholder="voce@exemplo.com" required></label>
        <input class="hp" name="website" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="cta" id="submit" type="submit"><span data-i18n="submit">Quero acompanhar</span><span class="cta-arrow" aria-hidden="true">↗</span></button>
      </form>
      <div class="form-meta"><span id="message" role="status" aria-live="polite"></span><span data-i18n="note">Sem spam. Sem apresentação antes da hora.</span></div>
    </div>
  </section>
  <footer class="footer"><span>© <span id="year"></span> MyTrues</span></footer>
</main>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/ambient.js"></script>
<script src="/assets/js/landing.js"></script>
</body>
</html>
