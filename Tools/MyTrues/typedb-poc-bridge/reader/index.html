<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="color-scheme" content="light">
<title>MyTrues</title>
<meta name="description" content="Estamos preparando algo incrível para você.">
<link rel="stylesheet" href="/assets/css/public.css">
</head>
<body>
<canvas id="ambient" class="ambient" aria-hidden="true"></canvas>
<main class="page">
  <div class="shell">
    <header class="header">
      <a class="brand" href="/" aria-label="MyTrues">
        <img src="/assets/mytrues-logo.png" alt="">
        <span class="brandword">MyTrues</span>
      </a>
      <div class="header-actions">
        <button class="quiet" id="lang" type="button">EN</button>
        <a class="quiet" href="/app" data-i18n="access" data-i18n-aria="access_aria">Acesso</a>
      </div>
    </header>

    <section class="hero">
      <div class="hero-inner">
        <div class="status"><span class="status-dot"></span><span data-i18n="status">Em preparação</span></div>
        <h1 data-i18n="headline">Estamos preparando algo incrível para você.</h1>
        <p class="lead" data-i18n="lead">Ainda não é hora de contar tudo. Se quiser acompanhar de perto e ser avisado quando abrirmos as portas, deixe seu nome.</p>
        <div class="rule" aria-hidden="true"></div>

        <div class="form-wrap">
          <form class="form" id="interest-form" novalidate>
            <div class="field"><input class="input" id="name" name="name" maxlength="120" autocomplete="name" data-i18n-placeholder="name_placeholder" placeholder="Seu nome" required></div>
            <div class="field"><input class="input" id="email" name="email" type="email" maxlength="240" autocomplete="email" data-i18n-placeholder="email_placeholder" placeholder="Seu melhor e-mail" required></div>
            <input class="hp" name="website" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button class="submit" id="submit" type="submit" data-i18n="submit">Quero acompanhar</button>
          </form>
          <div class="message" id="message" role="status" aria-live="polite"></div>
          <div class="note" data-i18n="note">Sem spam. Sem apresentação antes da hora.</div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-mark">MyTrues</div>
      <div>© <span id="year"></span></div>
    </footer>
  </div>
</main>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/ambient.js"></script>
<script src="/assets/js/landing.js"></script>
</body>
</html>
