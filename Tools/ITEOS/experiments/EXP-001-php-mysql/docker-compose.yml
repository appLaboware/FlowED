services:
  web:
    build:
      context: ./app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: iteos
      DB_USER: iteos
      DB_PASSWORD: iteos
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: iteos
      MYSQL_USER: iteos
      MYSQL_PASSWORD: iteos
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
