services:
  mytrues-fqdn:
    build:
      context: ./reference
    environment:
      MYTRUES_ENGINE: fixtures.engine_fqdn
      PORT: "8080"
    ports:
      - "18081:8080"

  mytrues-ip:
    build:
      context: ./reference
    environment:
      MYTRUES_ENGINE: fixtures.engine_ip
      PORT: "8080"
    ports:
      - "18082:8080"
