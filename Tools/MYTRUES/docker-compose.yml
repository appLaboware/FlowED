services:
  mytrues-senior-a:
    build:
      context: ./reference
    environment:
      MYTRUES_PROVIDER_ID: senior-a
      MYTRUES_PROVIDER_PROFILE: fqdn
      PORT: "8080"
    ports:
      - "18081:8080"

  mytrues-senior-b:
    build:
      context: ./reference
    environment:
      MYTRUES_PROVIDER_ID: senior-b
      MYTRUES_PROVIDER_PROFILE: ip
      PORT: "8080"
    ports:
      - "18082:8080"
