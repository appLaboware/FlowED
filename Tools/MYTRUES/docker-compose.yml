services:
  mytrues-senior-a:
    build:
      context: ./reference
    environment:
      MYTRUES_PROVIDER_ID: senior-a
      MYTRUES_PROVIDER_PROFILE: fqdn
      MYTRUES_DB_PATH: /data/mytrues.db
      MYTRUES_SEED_MANIFEST: /seeds/seed-004/manifest.json
      PORT: "8080"
    volumes:
      - senior-a-memory:/data
      - ./seeds:/seeds:ro
    ports:
      - "18081:8080"

  mytrues-senior-b:
    build:
      context: ./reference
    environment:
      MYTRUES_PROVIDER_ID: senior-b
      MYTRUES_PROVIDER_PROFILE: ip
      MYTRUES_DB_PATH: /data/mytrues.db
      MYTRUES_SEED_MANIFEST: /seeds/seed-004/manifest.json
      PORT: "8080"
    volumes:
      - senior-b-memory:/data
      - ./seeds:/seeds:ro
    ports:
      - "18082:8080"

volumes:
  senior-a-memory:
  senior-b-memory:
