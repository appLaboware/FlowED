id: flowed.project-genesis.repository-seed
version: 0.1-draft
status: incubation
kind: tool
owner_domain: FlowED
promotion_ready_root: true
input:
  required:
    - repository_plan
    - project_identity
    - current_stage
output:
  required:
    - materialized_paths
    - provenance
    - validation_state
invariants:
  - create_only_what_current_stage_requires
  - preserve_user_owned_content
  - unknown_remains_unknown
  - inspect_before_write_on_existing_repository
  - do_not_leak_future_internal_tools_without_operational_need
  - no_silent_overwrite
